services:
  - type: web
    name: Baton
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: baton-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: SHOW_WITHHELD_COUNT
        value: "false"

databases:
  - name: baton-postgres
    databaseName: baton
    user: baton
    plan: free
    region: singapore
